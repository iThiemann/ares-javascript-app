
services:
  app:
    image: ghcr.io/<OWNER>/javascript-app:staging
    container_name: javascript-app-staging
    depends_on:
      - db
    env_file:
      - .env.staging
    ports:
      - "3000:3000"
    restart: always

  db:
    image: mysql:8.4.6
    container_name: javascript-app-mysql-staging
    env_file:
      - .env.staging
    ports:
      - "3306:3306"
    command: --pid-file=/var/lib/mysql/mysqld.pid
    volumes:
      - mysql_data_staging:/var/lib/mysql
    restart: always

volumes:
  mysql_data_staging:
