
services:
  app:
    image: ghcr.io/<OWNER>/javascript-app:prod
    container_name: javascript-app-prod
    depends_on:
      - db
    env_file:
      - .env.prod
    ports:
      - "3000:3000"
    restart: always

  db:
    image: mysql:8.4.6
    container_name: javascript-app-mysql-prod
    env_file:
      - .env.prod
    ports:
      - "3306:3306"
    command: --pid-file=/var/lib/mysql/mysqld.pid
    volumes:
      - mysql_data_prod:/var/lib/mysql
    restart: always

volumes:
  mysql_data_prod:
