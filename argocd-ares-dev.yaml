apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ares-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ithiemann/ares-javascript-app.git
    targetRevision: develop
    path: deploy/helm/ares-app

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
