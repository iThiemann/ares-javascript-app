
services:
  app:
    build: .
    container_name: javascript-app
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: always

  db:
    image: mysql:8.0.21
    platform: linux/amd64
    container_name: javascript-app-mysql
    env_file:
      - .env
    ports:
      - "3306:3306"
    command: --pid-file /var/lib/mysql/mysqld.pid
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
