# Node 20
# GitHub Container Registry (GHCR) als Registry
# → Image: ghcr.io/<OWNER>/javascript-app
# SSH-Deploy auf Server, der dein docker-compose.yml nutzt (docker compose pull && docker compose up -d)

name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Format check (optional)
        run: npm run format:check
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Docker build (test only, no push)
        run: |
          docker build \
            -t javascript-app-ci:${{ github.sha }} \
            .
      
      - name: npm audit (ad-hoc dependency scan)
        run: npm audit --audit-level=high || true

      # Optional: Trivy Image Scan (Container Security)
      - name: Trivy scan image
        uses: aquasecurity/trivy-action@v0
        with:
          image-ref: javascript-app-ci:${{ github.sha }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'   # für CI nur reporten, nicht failen

