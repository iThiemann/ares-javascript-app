
name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write           # needed to push merge commits
  pull-requests: write      # needed to merge PRs

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    # Only run for Dependabot PRs
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Optional: debug info in logs
      - name: Show update type
        run: echo "Update type is ${{ steps.metadata.outputs.update-type }}"

      - name: Auto-merge patch Dependabot PR
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;

            // Try to merge - if branch protection requires checks,
            // this will only succeed once they are green.
            try {
              await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/merge', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash'
              });
              core.info(`Merged Dependabot PR #${prNumber}`);
            } catch (error) {
              core.warning(`Could not merge PR #${prNumber}: ${error.message}`);
            }
