
name: Dependabot Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependabot-ci:
    name: Run checks for Dependabot PR
    runs-on: ubuntu-latest

    # Only run this job for Dependabot PRs
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Quality checks for Dependabot PRs ---

      - name: Lint
        run: npm run lint
        # if you want lint to *not* fail Dependabot PRs, uncomment:
        # continue-on-error: true

      - name: Format check
        run: npm run format:check
        # or: npm run prettier:check / fmt:check – adapt to your scripts
        # continue-on-error: true   # optional

      - name: Run tests
        run: npm test
        # or: npm run test:ci / test:unit – adapt to your scripts

      - name: npm audit (high & critical)
        run: npm audit --audit-level=high
        # if you just want info but not failure for Dependabot PRs:
        # continue-on-error: true
