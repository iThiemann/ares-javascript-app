
name: Dependabot Checks

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: ${{ github.actor != 'dependabot[bot]' }}

      - name: Format check
        run: npm run format:check
        continue-on-error: ${{ github.actor != 'dependabot[bot]' }}

      - name: Run tests
        run: npm test

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: ${{ github.actor != 'dependabot[bot]' }}
