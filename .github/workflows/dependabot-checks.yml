
name: Dependabot Checks

on:
  push:
    branches:
      - "**"     # run on ALL branches
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependabot-ci:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true   # optional

      - name: Format check
        run: npm run format:check
        continue-on-error: true   # optional

      - name: Run tests
        run: npm test
        continue-on-error: false  # tests should normally fail if broken

      - name: npm audit (high & critical)
        run: npm audit --audit-level=high
        continue-on-error: true   # recommended for dependency PRs
