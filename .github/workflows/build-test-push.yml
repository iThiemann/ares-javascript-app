
name: Build, Test and Push to GHCR (Dev)

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Quality checks ---

      - name: Lint
        run: npm run lint
        continue-on-error: true
      
        # If you have a "format:check" script that *checks* formatting:
      - name: Format check
        run: npm run format:check
        continue-on-error: true
        # or: npm run prettier:check / npm run fmt:check, adapt to your scripts

      # Optional but usually a good idea
      # - name: Run tests
      #  run: npm test
        # or: npm run test:unit / npm run test:ci, adapt to your repo

      - name: npm audit
        run: npm audit --audit-level=high
        # You can relax the level (low/moderate) or add `|| true` if you only want warnings

      # --- Docker & GHCR ---

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$OWNER/ares-javascript-app:dev" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image.outputs.image }} .

      # --- Trivy scan ---

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.image.outputs.image }}
          vuln-type: 'os,library'
          format: 'table'
          exit-code: '1'                 # fail pipeline on HIGH/CRITICAL
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: |
          docker push ${{ steps.image.outputs.image }}

      - name: Export image tag
        id: meta
        run: echo "tag=dev" >> $GITHUB_OUTPUT

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
