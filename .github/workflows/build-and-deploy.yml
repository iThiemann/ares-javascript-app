# Trigger push auf develop → Build Image, push nach GHCR, Deploy nach Dev
# Trigger push auf main → Build Image, push nach GHCR, Deploy nach Staging
# Dazu brauchst du auf deinen Servern:
# Docker + Docker Compose
# dein Repo + docker-compose.yml
# .env.dev / .env.staging o.ä. (oder per Secrets generieren)
# Und in GitHub Secrets z.B.:
# GHCR_USERNAME (kann github.actor sein, wenn du GITHUB_TOKEN nutzt)
# GHCR_TOKEN (optional, GITHUB_TOKEN reicht normal)
# DEV_SSH_HOST, DEV_SSH_USER, DEV_SSH_KEY, DEV_PROJECT_PATH
# STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY, STAGING_PROJECT_PATH

name: Build and Deploy (Dev & Staging)

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/javascript-app

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

#  Einheitlicher Build-Prozess
#  Branch-spezifische Docker-Tags
#  Reproduzierbare Builds über Commit-SHA
#  Saubere Pipeline-Logik für Dev/Staging/Prod
#  andere Branches bekommen keine Staging/Prod-Tags
#  automatische Tag-Namen ohne hart codierte Strings

      - name: Compute image tags
        id: meta
        run: |
          SHA_TAG=${GITHUB_SHA}
          if [ "${GITHUB_REF##*/}" = "develop" ]; then
            ENV_TAG=dev
          elif [ "${GITHUB_REF##*/}" = "main" ]; then
            ENV_TAG=staging
          else
            ENV_TAG=other
          fi

          echo "image_tag_sha=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag_env=${ENV_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag=${SHA_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag_sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag_env }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Trivy scan pushed image (fail on critical in main)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag_sha }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to Dev via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd ${{ secrets.DEV_PROJECT_PATH }}
            git pull origin develop || true

            docker login ${{ env.REGISTRY }} \
              -u "${{ github.actor }}" \
              -p "${{ secrets.GITHUB_TOKEN }}"

            # env spezifisch: z.B. .env.dev -> .env
            cp .env.dev .env

            docker compose pull
            docker compose up -d

            # optional: Health-Check
            curl -f http://localhost:3000/health || exit 1

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_PROJECT_PATH }}
            git pull origin main || true

            docker login ${{ env.REGISTRY }} \
              -u "${{ github.actor }}" \
              -p "${{ secrets.GITHUB_TOKEN }}"

            # env spezifisch: z.B. .env.staging -> .env
            cp .env.staging .env

            docker compose pull
            docker compose up -d

            # optional: Health-Check
            curl -f http://localhost:3000/health || exit 1

