
services:
  app:
    build: .
    container_name: javascript-app-dev
    depends_on:
      - db
    env_file:
      - .env.dev
    ports:
      - "3000:3000"
    restart: always

  db:
    image: mysql:8.4.6
    container_name: javascript-app-mysql-dev
    env_file:
      - .env.dev
    ports:
      - "3306:3306"
    command: --pid-file=/var/lib/mysql/mysqld.pid
    volumes:
      - mysql_data_dev:/var/lib/mysql
    restart: always

volumes:
  mysql_data_dev:
