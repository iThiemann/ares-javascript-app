
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad-dev
  namespace: nomad
  labels:
    app: nomad
    component: dev-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nomad
      component: dev-agent
  template:
    metadata:
      labels:
        app: nomad
        component: dev-agent
    spec:
      containers:
        - name: nomad
          image: hashicorp/nomad:1.11.0
          imagePullPolicy: IfNotPresent

          # Explicit binary
          command: ["nomad"]
          # IMPORTANT: server-only dev mode to avoid client/cgroup inside container
          args:
            - "agent"
            - "-dev"
            - "-bind=0.0.0.0"
            - "-server"
            - "-bootstrap-expect=1"

          ports:
            - name: http
              containerPort: 4646
            - name: rpc
              containerPort: 4647
            - name: serf
              containerPort: 4648

          # No probes yet; add once it's stable
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
